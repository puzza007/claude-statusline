[package]
name = "claude-statusline-report"
version = "0.1.0"
edition = "2024"
description = "Serves the claude-statusline history report over HTTP"

[dependencies]
axum = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
